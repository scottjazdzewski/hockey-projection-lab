name: Hockey Goalie Feature ETL 001

on:
  push:
    branches: [main]
    paths:
      - 'research/build_goalie_game_features.py'
      - '.github/workflows/hockey-goalie-features-001.yml'

permissions:
  contents: read

jobs:
  goalie-features:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow requests numpy
      - name: Build historical goalie features
        run: python research/build_goalie_game_features.py --out goalie_feature_output
      - name: Show coverage
        run: |
          cat goalie_feature_output/summary.json
          echo '--- coverage ---'
          cat goalie_feature_output/coverage_by_season.csv
      - name: Package
        run: zip -r -9 goalie-game-features-001-20261102.zip goalie_feature_output >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: goalie-game-features-001-20261102
          path: goalie-game-features-001-20261102.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
