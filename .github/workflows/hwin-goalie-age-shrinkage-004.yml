name: HWIN Goalie Age and Exposure Calibration 004

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hwin_goalie_age_shrinkage_004.py'
      - '.github/workflows/hwin-goalie-age-shrinkage-004.yml'
  workflow_run:
    workflows: ["Hockey Goalie Feature ETL 001"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  goalie-age-shrinkage:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow scikit-learn numpy
      - name: Download canonical rolling inputs
        shell: bash
        run: |
          mkdir -p /tmp/pbp /tmp/pbp_u /tmp/spine /tmp/spine_u /tmp/goalie /tmp/goalie_u
          pbp_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-pbp-features.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          spine_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-game-spine-v3.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$pbp_run_id" ] || [ -z "$spine_run_id" ]; then
            echo "Missing successful full-PBP or canonical-spine feature run."
            exit 1
          fi
          echo "Using PBP run $pbp_run_id and spine run $spine_run_id"
          gh run download "$pbp_run_id" --repo "$GITHUB_REPOSITORY" -n hockey-pbp-features-2010-2027-20261102 -D /tmp/pbp
          unzip -q /tmp/pbp/hockey-pbp-features-2010-2027-20261102.zip -d /tmp/pbp_u
          gh run download "$spine_run_id" --repo "$GITHUB_REPOSITORY" -n hockey-canonical-spine-v3-20261102 -D /tmp/spine
          unzip -q /tmp/spine/hockey-canonical-spine-v3-20261102.zip -d /tmp/spine_u
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            goalie_run_id="${{ github.event.workflow_run.id }}"
          else
            goalie_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-goalie-features-001.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "$goalie_run_id" ] || [ "$goalie_run_id" = "null" ]; then
            echo "No successful goalie-history ETL run found."
            exit 1
          fi
          echo "Using goalie-history run $goalie_run_id"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${goalie_run_id}/artifacts" --jq '.artifacts[] | select(.name == "goalie-game-features-001-20261102") | .id' | head -n 1)"
          if [ -z "$artifact_id" ]; then
            echo "Goalie-history artifact missing from run $goalie_run_id."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/goalie/artifact.zip
          unzip -q /tmp/goalie/artifact.zip -d /tmp/goalie
          unzip -q /tmp/goalie/goalie-game-features-001-20261102.zip -d /tmp/goalie_u
      - name: Run nested rolling age and exposure calibration
        run: |
          python research/hwin_goalie_age_shrinkage_004.py \
            --pbp /tmp/pbp_u/pbp_feature_output/game_team_event_features.parquet \
            --spine /tmp/spine_u/spine_v3/games.parquet \
            --goalie /tmp/goalie_u/goalie_feature_output/goalie_game_features.parquet \
            --out hwin_goalie_age_shrinkage_004
      - name: Show candidate results
        run: |
          cat hwin_goalie_age_shrinkage_004/summary.json
          cat hwin_goalie_age_shrinkage_004/rolling_age_exposure_backtest.csv
      - name: Package research candidate
        run: |
          zip -r -9 hwin-goalie-age-shrinkage-004-20261103.zip hwin_goalie_age_shrinkage_004 >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: hwin-goalie-age-shrinkage-004-20261103
          path: hwin-goalie-age-shrinkage-004-20261103.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
