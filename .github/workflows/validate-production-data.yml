name: Validate Production Data

on:
  push:
    branches: [main]
    paths:
      - 'public/data/**'
      - 'artifacts/schemas/**'
      - 'src/production/validate-public-data.mjs'
      - 'src/production/validate-site-contract.mjs'
      - 'public/assets/production-data.js'
      - 'public/assets/game-cards.js'
      - 'public/assets/game-cards.css'
      - 'src/market/**'
      - 'public/assets/team-ratings.js'
      - 'public/assets/team-profile.js'
      - 'public/assets/performance.js'
      - 'public/assets/today-games.js'
      - 'public/index.html'
      - 'public/game-cards/**'
      - 'public/teams/**'
      - 'public/performance/**'
      - '.github/workflows/validate-production-data.yml'
  pull_request:
    paths:
      - 'public/data/**'
      - 'src/production/validate-public-data.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production exports
        run: node src/production/validate-public-data.mjs
      - name: Validate site integration contract
        run: node src/production/validate-site-contract.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify benchmark arithmetic and pregame freeze
        run: python src/market/update_market_benchmark.py --self-test
