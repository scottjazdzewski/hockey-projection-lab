name: Score Hockey Lab Game V1

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional production rescore reason"
        required: false
        type: string
  schedule:
    - cron: '0 15 * * *'
  push:
    branches: [main]
    paths:
      - 'src/production/hockey_lab_game_v1.py'
      - 'artifacts/models/goalie-adjustment-model.json'
      - '.github/workflows/score-hockey-lab-game-v1.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-lab-production-data
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow scikit-learn numpy

      - name: Download canonical research inputs
        run: |
          mkdir -p /tmp/pbp /tmp/pbp_u /tmp/spine /tmp/spine_u /tmp/goalie /tmp/goalie_u
          pbp_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-pbp-features.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          spine_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-game-spine-v3.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          gh run download "$pbp_run_id" --repo "$GITHUB_REPOSITORY" -n hockey-pbp-features-2010-2027-20261102 -D /tmp/pbp
          unzip -q /tmp/pbp/hockey-pbp-features-2010-2027-20261102.zip -d /tmp/pbp_u
          gh run download "$spine_run_id" --repo "$GITHUB_REPOSITORY" -n hockey-canonical-spine-v3-20261102 -D /tmp/spine
          unzip -q /tmp/spine/hockey-canonical-spine-v3-20261102.zip -d /tmp/spine_u

          # The goalie layer uses the promoted prospective calibration and is
          # refreshed from the latest successful prior-only history build.
          goalie_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-goalie-features-001.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$goalie_run_id" ] && [ "$goalie_run_id" != "null" ]; then
            if gh run download "$goalie_run_id" --repo "$GITHUB_REPOSITORY" -n goalie-game-features-001-20261102 -D /tmp/goalie && unzip -q /tmp/goalie/goalie-game-features-001-20261102.zip -d /tmp/goalie_u; then
              echo "Loaded goalie history for the gated scorer."
            else
              echo "Goalie-history artifact unavailable; score team-only."
            fi
          else
            echo "No successful goalie-history artifact; score team-only."
          fi

      # Production scorer preserves normalized live pregame context.
      - name: Score current slate
        run: |
          rm -rf /tmp/hwin_v1 && mkdir -p /tmp/hwin_v1
          GOALIE_ARGS=()
          GOALIE_HISTORY=/tmp/goalie_u/goalie_feature_output/goalie_game_features.parquet
          GOALIE_MODEL=artifacts/models/goalie-adjustment-model.json
          if [ -f "$GOALIE_HISTORY" ] && [ -f "$GOALIE_MODEL" ]; then
            GOALIE_ARGS=(--goalie-model "$GOALIE_MODEL" --goalie-history "$GOALIE_HISTORY")
          fi
          python src/production/hockey_lab_game_v1.py             --pbp /tmp/pbp_u/pbp_feature_output/game_team_event_features.parquet             --spine /tmp/spine_u/spine_v3/games.parquet             --schedule public/data/today-games.json             --context public/data/live-context.json             --out /tmp/hwin_v1             "${GOALIE_ARGS[@]}"
          cat /tmp/hwin_v1/scorer-manifest.json
          cp /tmp/hwin_v1/game-projections.json public/data/game-projections.json
          cp /tmp/hwin_v1/model-performance.json public/data/model-performance.json

      - name: Mark production surfaces READY
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/data/production-manifest.json")
          m=json.loads(p.read_text())
          projections=json.loads(Path("public/data/game-projections.json").read_text())
          model=projections.get("model",{})
          for key in ["game_projections","model_performance"]:
              m["surfaces"][key]["state"]="READY"
              m["surfaces"][key]["model_id"]=model.get("model_id")
              m["surfaces"][key]["model_version"]=model.get("version")
          from datetime import datetime, timezone
          m["updated_at"]=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY

      - name: Validate production output
        run: |
          node src/production/validate-public-data.mjs
          node src/production/validate-site-contract.mjs

      - name: Commit current projections
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/game-projections.json public/data/model-performance.json public/data/production-manifest.json
          if git diff --cached --quiet; then
            echo "No projection changes."
          else
            git commit -m "Publish Hockey Lab Game v1 projections"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger final forward snapshot after goalie-aware rescore
        if: github.event_name == 'workflow_dispatch' && inputs.reason == 'goalie-change'
        run: gh workflow run update-forward-ledger.yml
