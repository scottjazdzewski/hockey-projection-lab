name: Goals Rate Tail Audit 007

on:
  workflow_dispatch:
  push:
    branches: [codex/model-accuracy-test-battery-016]
    paths:
      - 'research/goals_rate_offset_tail_audit_007.py'
      - '.github/workflows/goals-rate-tail-audit-007.yml'

permissions:
  contents: read
  actions: read

jobs:
  goals-rate-tail-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: codex/hockey-goals-rate-offset-006
          path: goals-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install goal model dependencies
        working-directory: goals-src/research
        run: python -m pip install --quiet -r requirements-goals-rate-offset-006.txt

      - name: Locate canonical input runs
        id: inputs
        shell: bash
        run: |
          pbp_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-pbp-features.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          spine_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hockey-game-spine-v3.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$pbp_run_id" ] || [ -z "$spine_run_id" ]; then
            echo "Missing a successful PBP or spine feature run."
            exit 1
          fi
          echo "pbp_run_id=$pbp_run_id" >> "$GITHUB_OUTPUT"
          echo "spine_run_id=$spine_run_id" >> "$GITHUB_OUTPUT"
          echo "Using PBP run $pbp_run_id, spine run $spine_run_id"

      - name: Download canonical rolling inputs
        env:
          PBP_RUN_ID: ${{ steps.inputs.outputs.pbp_run_id }}
          SPINE_RUN_ID: ${{ steps.inputs.outputs.spine_run_id }}
        shell: bash
        run: |
          mkdir -p /tmp/pbp /tmp/pbp_u /tmp/spine /tmp/spine_u
          gh run download "$PBP_RUN_ID" --repo "$GITHUB_REPOSITORY" -n hockey-pbp-features-2010-2027-20261102 -D /tmp/pbp
          unzip -q /tmp/pbp/hockey-pbp-features-2010-2027-20261102.zip -d /tmp/pbp_u
          gh run download "$SPINE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n hockey-canonical-spine-v3-20261102 -D /tmp/spine
          unzip -q /tmp/spine/hockey-canonical-spine-v3-20261102.zip -d /tmp/spine_u

      - name: Run rolling goal-rate model and paired tail audit
        env:
          PYTHONPATH: ${{ github.workspace }}/goals-src/research:${{ github.workspace }}/src/production
          PBP_RUN_ID: ${{ steps.inputs.outputs.pbp_run_id }}
          SPINE_RUN_ID: ${{ steps.inputs.outputs.spine_run_id }}
        run: |
          python goals-src/research/hockey_goals_rate_offset_006.py \
            --pbp /tmp/pbp_u/pbp_feature_output/game_team_event_features.parquet \
            --spine /tmp/spine_u/spine_v3/games.parquet \
            --out goals_rate_offset_006
          python research/goals_rate_offset_tail_audit_007.py \
            --oof goals_rate_offset_006/oof_predictions.parquet \
            --out goals_rate_offset_tail_audit_007

      - name: Show paired diagnostics
        run: |
          cat goals_rate_offset_tail_audit_007/summary.json
          cat goals_rate_offset_tail_audit_007/paired_metric_deltas.csv
          cat goals_rate_offset_tail_audit_007/season_deltas.csv
          cat goals_rate_offset_tail_audit_007/tail_reliability_deciles.csv

      - name: Package research output
        run: zip -r -9 goals-rate-tail-audit-007.zip goals_rate_offset_006 goals_rate_offset_tail_audit_007 >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: goals-rate-tail-audit-007
          path: goals-rate-tail-audit-007.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
