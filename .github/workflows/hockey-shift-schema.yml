name: Hockey Shift Schema Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hockey-shift-schema.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow requests
      - name: Inspect shift schemas
        run: |
          python - <<'PY'
          import pandas as pd, requests, io
          B="https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nhl_shifts"
          for y in [2010,2014,2015,2016,2019,2024,2026,2027]:
              u=f"{B}/shifts_{y}.parquet"
              r=requests.get(u,timeout=120)
              if r.status_code==404:
                  print("MISSING",y); continue
              r.raise_for_status()
              d=pd.read_parquet(io.BytesIO(r.content))
              print("\nYEAR",y,"ROWS",len(d),"COLS",list(d.columns))
              print(d.head(3).to_string(index=False))
          PY
