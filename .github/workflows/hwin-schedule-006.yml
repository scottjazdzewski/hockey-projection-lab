name: HWIN Schedule Context 006
on:
  push:
    branches: [main]
    paths:
      - 'research/hwin_schedule_006.py'
      - '.github/workflows/hwin-schedule-006.yml'
permissions:
  contents: read
  actions: read
jobs:
  schedule-context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas pyarrow scikit-learn numpy
      - name: Download canonical inputs
        run: |
          mkdir -p /tmp/pbp /tmp/pbp_u /tmp/spine /tmp/spine_u /tmp/goalie /tmp/goalie_u
          gh run download 41537361054 -n hockey-pbp-features-2010-2027-20261102 -D /tmp/pbp
          unzip -q /tmp/pbp/hockey-pbp-features-2010-2027-20261102.zip -d /tmp/pbp_u
          gh run download 41537437104 -n hockey-canonical-spine-v3-20261102 -D /tmp/spine
          unzip -q /tmp/spine/hockey-canonical-spine-v3-20261102.zip -d /tmp/spine_u
          gh run download 41539429864 -n goalie-game-features-001-20261102 -D /tmp/goalie
          unzip -q /tmp/goalie/goalie-game-features-001-20261102.zip -d /tmp/goalie_u
      - name: Run schedule-context increment test
        run: |
          python research/hwin_schedule_006.py \
            --pbp /tmp/pbp_u/pbp_feature_output/game_team_event_features.parquet \
            --spine /tmp/spine_u/spine_v3/games.parquet \
            --goalie /tmp/goalie_u/goalie_feature_output/goalie_game_features.parquet \
            --out hwin_schedule_006
      - run: |
          cat hwin_schedule_006/summary.json
          cat hwin_schedule_006/rolling_schedule_006.csv
      - run: zip -r -9 hwin-schedule-006-20261102.zip hwin_schedule_006 >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: hwin-schedule-006-20261102
          path: hwin-schedule-006-20261102.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
