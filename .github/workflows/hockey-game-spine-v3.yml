name: Hockey Canonical Game Spine V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hockey-game-spine-v3.yml'

permissions:
  contents: read

jobs:
  build-canonical-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow requests
      - name: Build season-authoritative game spine
        shell: bash
        run: |
          cat > /tmp/spine_v3.py <<'PY'
          import json, hashlib
          from pathlib import Path
          import pandas as pd, requests, numpy as np, numpy as np

          BASE="https://github.com/sportsdataverse/sportsdataverse-data/releases/download"
          OUT=Path("spine_v3"); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({"User-Agent":"HockeyProjectionLab/0.2"})
          manifest=[]
          families={
            "team_box":("nhl_team_boxscores","team_box_{season}.parquet"),
            "goalie_box":("nhl_goalie_boxscores","goalie_box_{season}.parquet"),
            "game_rosters":("nhl_game_rosters","game_rosters_{season}.parquet"),
            "scratches":("nhl_scratches","scratches_{season}.parquet"),
          }
          frames={k:[] for k in ["games"]+list(families)}
          season_audit={}

          def dl(url,p):
              r=s.get(url,timeout=120); r.raise_for_status()
              data=r.content; Path(p).write_bytes(data)
              manifest.append({"url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              return Path(p)

          for season in range(2010,2028):
              su=f"{BASE}/nhl_schedules/nhl_schedule_{season}.parquet"
              sp=dl(su,f"/tmp/schedule_{season}.parquet")
              sched=pd.read_parquet(sp); sp.unlink()
              sched["game_id"]=pd.to_numeric(sched["game_id"],errors="coerce").astype("Int64")
              sched=sched.dropna(subset=["game_id"]).drop_duplicates("game_id").copy()
              sched["source_season"]=season
              sched["source_url"]=su
              sched=sched.rename(columns={
                  "home_score":"provider_schedule_home_score_untrusted",
                  "away_score":"provider_schedule_away_score_untrusted"
              })
              frames["games"].append(sched)
              ids=set(sched["game_id"].astype(int).tolist())
              audit={"games":len(sched),"game_types":sched["game_type"].astype("string").value_counts(dropna=False).to_dict()}

              for fam,(tag,pat) in families.items():
                  name=pat.format(season=season)
                  u=f"{BASE}/{tag}/{name}"
                  p=dl(u,f"/tmp/{name}")
                  df=pd.read_parquet(p); p.unlink()
                  before=len(df)
                  if "game_id" not in df.columns:
                      print("UNJOINABLE_LEGACY_FILE",season,fam,"rows",before,"columns",list(df.columns),flush=True)
                      audit[fam]={"raw_rows":before,"kept_rows":0,"dropped_unjoinable_rows":before}
                      continue
                  df["game_id"]=pd.to_numeric(df["game_id"],errors="coerce").astype("Int64")
                  df=df[df["game_id"].isin(ids)].copy()
                  df["source_season"]=season
                  df["source_url"]=u
                  frames[fam].append(df)
                  audit[fam]={"raw_rows":before,"kept_rows":len(df),"dropped_overlap_rows":before-len(df)}
              season_audit[str(season)]=audit
              print("SEASON",season,json.dumps(audit),flush=True)

          outputs={}
          for fam,fs in frames.items():
              out=pd.concat(fs,ignore_index=True,sort=False)
              for c in out.columns:
                  if out[c].dtype=="object": out[c]=out[c].astype("string")
              if fam=="games":
                  dup=int(out.duplicated(["game_id"]).sum())
                  if dup: raise RuntimeError(f"duplicate canonical game ids: {dup}")
              elif fam=="team_box":
                  dup=int(out.duplicated(["game_id","home_away"]).sum())
                  if dup: raise RuntimeError(f"duplicate team game-side rows: {dup}")
              elif fam in ("goalie_box","game_rosters"):
                  dup=int(out.duplicated(["game_id","player_id"]).sum())
                  if dup:
                      # preserve only genuinely distinct records if provider duplicated an exact player-game row
                      out=out.drop_duplicates(["game_id","player_id"],keep="last")
              elif fam=="scratches":
                  dup=int(out.duplicated(["game_id","id"]).sum())
                  if dup: out=out.drop_duplicates(["game_id","id"],keep="last")
              out.to_parquet(OUT/f"{fam}.parquet",index=False)
              outputs[fam]={"rows":len(out),"games":int(out["game_id"].nunique())}
              print("OUTPUT",fam,outputs[fam],flush=True)

          games=pd.read_parquet(OUT/"games.parquet")
          goalies=pd.read_parquet(OUT/"goalie_box.parquet")
          goalies["decision_norm"]=goalies["decision"].astype("string").str.upper().str.strip()
          w=goalies[goalies["decision_norm"].eq("W")][["game_id","home_away","team_abbrev"]].copy()
          wc=w.groupby("game_id").size()
          if int((wc!=1).sum()):
              raise RuntimeError(f"goalie winner integrity failure: games_not_exactly_one_winner={int((wc!=1).sum())}")
          w=w.drop_duplicates("game_id").rename(columns={
              "home_away":"winner_home_away","team_abbrev":"winner_team_abbrev"
          })
          w["winner_home_away"]=w["winner_home_away"].astype("string").str.lower()
          games=games.merge(w,on="game_id",how="left")
          games["result_available"]=games["winner_home_away"].notna()
          games["home_win"]=pd.Series(pd.NA,index=games.index,dtype="boolean")
          mask=games["result_available"]
          games.loc[mask,"home_win"]=games.loc[mask,"winner_home_away"].eq("home").astype(bool)
          expected=pd.Series(pd.NA,index=games.index,dtype="string")
          home_mask=games["winner_home_away"].eq("home").fillna(False)
          away_mask=games["winner_home_away"].eq("away").fillna(False)
          expected.loc[home_mask]=games.loc[home_mask,"home_team_abbr"].astype("string")
          expected.loc[away_mask]=games.loc[away_mask,"away_team_abbr"].astype("string")
          bad_identity=mask & ~games["winner_team_abbrev"].astype("string").eq(expected).fillna(False)
          if int(bad_identity.sum()):
              raise RuntimeError(f"winner identity mismatch={int(bad_identity.sum())}")
          games.to_parquet(OUT/"games.parquet",index=False)
          completed=games[games["result_available"]].copy()
          summary={
              "outputs":{**outputs,"games":{"rows":len(games),"games":int(games["game_id"].nunique())}},
              "result_games":len(completed),
              "result_regular":int((completed["game_type"].astype("string")=="R").sum()),
              "result_playoffs":int((completed["game_type"].astype("string")=="P").sum()),
              "home_win_rate_regular":float(completed.loc[completed["game_type"].astype("string").eq("R"),"home_win"].astype(float).mean()),
              "home_win_rate_playoffs":float(completed.loc[completed["game_type"].astype("string").eq("P"),"home_win"].astype(float).mean()),
              "winner_identity_mismatches":int(bad_identity.sum()),
              "preseason":int((games["game_type"].astype("string")=="PR").sum()),
              "date_min":str(games["game_date"].min()),
              "date_max":str(games["game_date"].max()),
              "outcome_authority":"Goalie W decision. Provider schedule score fields retained only under *_untrusted names.",
              "season_audit":season_audit
          }
          pd.DataFrame(manifest).to_csv(OUT/"source_manifest.csv",index=False)
          with open(OUT/"summary.json","w") as f: json.dump(summary,f,indent=2,default=str)
          print("FINAL",json.dumps({k:v for k,v in summary.items() if k!="season_audit"}),flush=True)
          PY
          python /tmp/spine_v3.py
      - name: Package canonical spine
        run: |
          zip -r -9 hockey-canonical-spine-v3-20261102.zip spine_v3 >/dev/null
          ls -lh hockey-canonical-spine-v3-20261102.zip spine_v3/*
      - uses: actions/upload-artifact@v4
        with:
          name: hockey-canonical-spine-v3-20261102
          path: hockey-canonical-spine-v3-20261102.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
