name: HWIN Schedule Increment 007 — No Goalie
on:
  push:
    branches:
      - codex/hwin-schedule-007-no-goalie
    paths:
      - 'research/hwin_schedule_007.py'
      - '.github/workflows/hwin-schedule-007-no-goalie.yml'
permissions:
  contents: read
  actions: read
jobs:
  schedule-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow scikit-learn numpy
      - name: Download canonical historical inputs
        run: |
          mkdir -p /tmp/pbp /tmp/pbp_u /tmp/spine /tmp/spine_u
          gh run download 41537361054 -n hockey-pbp-features-2010-2027-20261102 -D /tmp/pbp
          unzip -q /tmp/pbp/hockey-pbp-features-2010-2027-20261102.zip -d /tmp/pbp_u
          gh run download 41537437104 -n hockey-canonical-spine-v3-20261102 -D /tmp/spine
          unzip -q /tmp/spine/hockey-canonical-spine-v3-20261102.zip -d /tmp/spine_u
      - name: Run chronological no-goalie schedule increment
        run: |
          python research/hwin_schedule_007.py \
            --pbp /tmp/pbp_u/pbp_feature_output/game_team_event_features.parquet \
            --spine /tmp/spine_u/spine_v3/games.parquet \\
            --out hwin_schedule_007
      - name: Validate and summarize artifacts
        run: |
          cat hwin_schedule_007/summary.json
          python - <<'PY'
          import numpy as np
          import pandas as pd
          p = pd.read_parquet('hwin_schedule_007/oof_predictions.parquet')
          assert p.groupby('model_variant').size().nunique() == 1
          assert np.allclose(p.p_home + p.p_away, 1.0, atol=1e-12)
          assert not p.duplicated(['model_variant', 'game_id']).any()
          print(f"validated {len(p):,} frozen out-of-fold prediction rows")
          PY
      - run: zip -r -9 hwin-schedule-007-no-goalie-20261103.zip hwin_schedule_007 >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: hwin-schedule-007-no-goalie-20261103
          path: hwin-schedule-007-no-goalie-20261103.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

