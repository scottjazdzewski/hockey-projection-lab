name: Update Live NHL Context

on:
  workflow_dispatch:
  schedule:
    # Early context pass follows the 5:00 AM slate build.
    - cron: '15 9 * * *'
    - cron: '15 10 * * *'
    # Target later local refreshes around 10:30 AM, 2:30 PM and 5:30 PM ET.
    # Paired UTC hours let the script run year-round through DST transitions.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  push:
    branches: [main]
    paths:
      - 'src/live_context/update_live_context.py'
      - '.github/workflows/update-live-context.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-lab-production-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Gate duplicate DST cron pair
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now=datetime.now(ZoneInfo("America/New_York"))
          allowed_hours={5,10,14,17}
          run=now.hour in allowed_hours
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          print("local",now.isoformat(),"run",run)
          PY
      - name: Fetch and normalize live context
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python src/live_context/update_live_context.py
      - name: Detect confirmed-goalie change requiring model rescore
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        id: rescore
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          current=json.loads(Path("public/data/live-context.json").read_text())
          projection=json.loads(Path("public/data/game-projections.json").read_text())
          feature_version=str(projection.get("model",{}).get("feature_version","")).lower()
          uses_goalie="goalie" in feature_version

          try:
              prior_text=subprocess.check_output(
                  ["git","show","HEAD:public/data/live-context.json"],text=True
              )
              prior=json.loads(prior_text)
          except Exception:
              prior={"games":[]}

          def confirmed_map(payload):
              out={}
              for g in payload.get("games",[]):
                  gid=str(g.get("game_id"))
                  for side in ("away","home"):
                      goalie=(g.get(side) or {}).get("goalie") or {}
                      if goalie.get("status")=="CONFIRMED":
                          out[(gid,side)]=goalie.get("name")
              return out

          old=confirmed_map(prior)
          new=confirmed_map(current)
          changed=any(old.get(k)!=v for k,v in new.items())
          should=bool(changed and uses_goalie)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"confirmed_change={'true' if changed else 'false'}\n")
              fh.write(f"uses_goalie={'true' if uses_goalie else 'false'}\n")
              fh.write(f"run={'true' if should else 'false'}\n")
          print(json.dumps({
              "confirmed_goalie_change":changed,
              "active_model_uses_goalie":uses_goalie,
              "trigger_rescore":should,
              "feature_version":feature_version
          },indent=2))
          PY

      - name: Validate production files
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          node src/production/validate-public-data.mjs
          node src/production/validate-site-contract.mjs
      - name: Commit when changed
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/live-context.json public/data/game-projections.json
          if git diff --cached --quiet; then
            echo "No live-context change."
          else
            git commit -m "Update live NHL goalie and lineup context"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger goalie-aware pregame rescore
        if: (github.event_name != 'schedule' || steps.gate.outputs.run == 'true') && steps.rescore.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run score-hockey-lab-game-v1.yml -f reason=confirmed-goalie-change
