name: Update Live NHL Context

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional live-context refresh reason"
        required: false
        type: string
  schedule:
    # Quarter-hour heartbeat. The gate below performs a provider pull only at
    # fixed daily checkpoints or when a scheduled game is entering its
    # ~30-minute or ~15-minute pregame window.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/live_context/update_live_context.py'
      - '.github/workflows/update-live-context.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-lab-production-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gate fixed and pregame refresh windows
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os

          tz=ZoneInfo("America/New_York")
          now=datetime.now(tz)

          # Read the last successful provider observation so a 5-minute
          # heartbeat cannot duplicate the same target refresh.
          last_generated=None
          try:
              current=json.loads(Path("public/data/live-context.json").read_text())
              raw=current.get("generated_at")
              if raw:
                  last_generated=datetime.fromisoformat(raw).astimezone(tz)
          except Exception as exc:
              print("live-context timestamp warning:",repr(exc))

          def due(target, grace_minutes=10):
              if now < target:
                  return False
              if (now-target).total_seconds() > grace_minutes*60:
                  return False
              return last_generated is None or last_generated < target

          # Daily checkpoints are target times with a grace window, not exact
          # cron minutes. This survives ordinary GitHub Actions schedule delay.
          fixed_targets=[
              now.replace(hour=5,minute=15,second=0,microsecond=0),
              now.replace(hour=10,minute=30,second=0,microsecond=0),
              now.replace(hour=14,minute=30,second=0,microsecond=0),
              now.replace(hour=17,minute=30,second=0,microsecond=0),
          ]
          fixed_due=[t.isoformat() for t in fixed_targets if due(t,10)]

          # Every game gets two dedicated provider refreshes. A refresh is
          # considered complete only when live-context generated_at is at or
          # after that exact target time.
          pregame_30=[]
          pregame_15=[]
          try:
              slate=json.loads(Path("public/data/today-games.json").read_text())
              for game in slate.get("games",[]):
                  start_raw=game.get("start_time_et")
                  if not start_raw:
                      continue
                  start=datetime.fromisoformat(start_raw).astimezone(tz)
                  item={
                      "game_id":game.get("game_id"),
                      "matchup":f"{game.get('away_abbr')}@{game.get('home_abbr')}",
                      "start_time":start.isoformat()
                  }
                  t30=start-timedelta(minutes=30)
                  t15=start-timedelta(minutes=15)
                  if due(t30,10):
                      pregame_30.append({**item,"target_time":t30.isoformat()})
                  if due(t15,10):
                      pregame_15.append({**item,"target_time":t15.isoformat()})
          except Exception as exc:
              print("pregame gate warning:",repr(exc))

          scheduled_run=bool(fixed_due or pregame_30 or pregame_15)
          run=True if os.environ.get("GITHUB_EVENT_NAME")!="schedule" else scheduled_run
          reason="manual_or_push"
          if os.environ.get("GITHUB_EVENT_NAME")=="schedule":
              if pregame_15:
                  reason="pregame_15"
              elif pregame_30:
                  reason="pregame_30"
              elif fixed_due:
                  reason="fixed_checkpoint"
              else:
                  reason="skip"

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"pregame_30={'true' if bool(pregame_30) else 'false'}\n")
              f.write(f"pregame_15={'true' if bool(pregame_15) else 'false'}\n")

          print(json.dumps({
              "local_time":now.isoformat(),
              "last_generated":last_generated.isoformat() if last_generated else None,
              "fixed_due":fixed_due,
              "pregame_30_games":pregame_30,
              "pregame_15_games":pregame_15,
              "run":run,
              "reason":reason
          },indent=2))
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Install live-context dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch and normalize live context
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python src/live_context/update_live_context.py

      - name: Detect daily slate rollover
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        id: rollover
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          schedule=json.loads(Path("public/data/today-games.json").read_text())
          projection=json.loads(Path("public/data/game-projections.json").read_text())
          scheduled={str(g.get("game_id")) for g in schedule.get("games",[])}
          projected={str(g.get("game_id")) for g in projection.get("projections",[])}
          schedule_date=schedule.get("date")
          projection_dates={g.get("game_date") for g in projection.get("projections",[]) if g.get("game_date")}
          mismatch=scheduled!=projected or (projection_dates and projection_dates!={schedule_date})
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if mismatch else 'false'}\n")
          print(json.dumps({
              "schedule_date":schedule_date,
              "projection_dates":sorted(projection_dates),
              "scheduled_games":sorted(scheduled),
              "projected_games":sorted(projected),
              "daily_rollover_needed":mismatch
          },indent=2))
          PY

      - name: Detect selected-goalie change requiring model rescore
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        id: rescore
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          current=json.loads(Path("public/data/live-context.json").read_text())
          projection=json.loads(Path("public/data/game-projections.json").read_text())
          feature_version=str(projection.get("model",{}).get("feature_version","")).lower()
          uses_goalie="goalie-adjustment-" in feature_version

          try:
              prior_text=subprocess.check_output(
                  ["git","show","HEAD:public/data/live-context.json"],text=True
              )
              prior=json.loads(prior_text)
          except Exception:
              prior={"games":[]}

          def selected_map(payload):
              out={}
              for g in payload.get("games",[]):
                  gid=str(g.get("game_id"))
                  for side in ("away","home"):
                      goalie=(g.get(side) or {}).get("goalie") or {}
                      status=str(goalie.get("status") or "UNKNOWN").upper()
                      if status not in {"PROJECTED","CONFIRMED"}:
                          status="UNKNOWN"
                      name=goalie.get("name") if status!="UNKNOWN" else None
                      player_id=goalie.get("player_id") if status!="UNKNOWN" else None
                      out[(gid,side)]={
                          "status":status,
                          "name":str(name).strip().casefold() if name else None,
                          "player_id":str(player_id) if player_id is not None else None
                      }
              return out

          old=selected_map(prior)
          new=selected_map(current)
          changed=old!=new
          should=bool(changed and uses_goalie)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"goalie_change={'true' if changed else 'false'}\n")
              fh.write(f"uses_goalie={'true' if uses_goalie else 'false'}\n")
              fh.write(f"run={'true' if should else 'false'}\n")
          print(json.dumps({
              "selected_goalie_change":changed,
              "active_model_uses_goalie":uses_goalie,
              "trigger_rescore":should,
              "feature_version":feature_version
          },indent=2))
          PY

      - name: Validate rollover live context
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'daily-slate-rollover') || steps.rollover.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schedule=json.loads(Path("public/data/today-games.json").read_text())
          context=json.loads(Path("public/data/live-context.json").read_text())
          if context.get("date") != schedule.get("date"):
              raise SystemExit("live-context date does not match today's slate")
          schedule_by_id={str(g.get("game_id")):g for g in schedule.get("games",[])}
          context_by_id={str(g.get("game_id")):g for g in context.get("games",[])}
          if set(schedule_by_id) != set(context_by_id):
              raise SystemExit("live-context coverage does not exactly match today's slate")
          for gid,g in context_by_id.items():
              s=schedule_by_id[gid]
              for side in ("away","home"):
                  team=g.get(side) or {}
                  if team.get("abbr") != s.get(side+"_abbr"):
                      raise SystemExit(f"{gid} {side} team mismatch")
                  goalie=team.get("goalie") or {}
                  if goalie.get("status") not in {"UNKNOWN","PROJECTED","CONFIRMED"}:
                      raise SystemExit(f"{gid} {side} invalid goalie status")
          print("PASS: rollover live context matches today's slate")
          PY

      - name: Validate production files
        if: (github.event_name != 'schedule' || steps.gate.outputs.run == 'true') && !((github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'daily-slate-rollover') || steps.rollover.outputs.run == 'true')
        run: |
          node src/production/validate-public-data.mjs
          node src/production/validate-site-contract.mjs
      - name: Commit when changed
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/live-context.json public/data/game-projections.json
          if git diff --cached --quiet; then
            echo "No live-context change."
          else
            git commit -m "Update live NHL goalie and lineup context"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger forward snapshot after final pregame context pass
        if: ((github.event_name != 'schedule' && github.event.inputs.reason != 'daily-slate-rollover' && steps.rollover.outputs.run != 'true') || steps.gate.outputs.pregame_15 == 'true') && steps.rescore.outputs.run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-forward-ledger.yml

      - name: Trigger production rescore
        if: (steps.rescore.outputs.run == 'true') || (steps.rollover.outputs.run == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'daily-slate-rollover')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          reason="goalie-change"
          if [ "${{ github.event.inputs.reason }}" = "daily-slate-rollover" ] || [ "${{ steps.rollover.outputs.run }}" = "true" ]; then
            reason="daily-slate-rollover"
          fi
          gh workflow run score-hockey-lab-game-v1.yml -f reason="$reason"
