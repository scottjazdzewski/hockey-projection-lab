name: Update Live NHL Context

on:
  workflow_dispatch:
  schedule:
    # Target local refreshes around 10:30 AM, 2:30 PM and 5:30 PM ET.
    # Paired UTC hours let the script run year-round through DST transitions.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  push:
    branches: [main]
    paths:
      - 'src/live_context/update_live_context.py'
      - '.github/workflows/update-live-context.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Gate duplicate DST cron pair
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now=datetime.now(ZoneInfo("America/New_York"))
          allowed_hours={10,14,17}
          run=now.hour in allowed_hours
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          print("local",now.isoformat(),"run",run)
          PY
      - name: Fetch and normalize live context
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python src/live_context/update_live_context.py
      - name: Validate production files
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          node src/production/validate-public-data.mjs
          node src/production/validate-site-contract.mjs
      - name: Commit when changed
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/live-context.json public/data/game-projections.json
          if git diff --cached --quiet; then
            echo "No live-context change."
          else
            git commit -m "Update live NHL goalie and lineup context"
            git pull --rebase origin main
            git push
          fi
