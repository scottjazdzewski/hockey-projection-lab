name: Update Live NHL Context

on:
  workflow_dispatch:
  schedule:
    # Quarter-hour heartbeat. The gate below performs a provider pull only at
    # fixed daily checkpoints or when a scheduled game is entering its
    # ~15-minute pregame window.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/live_context/update_live_context.py'
      - '.github/workflows/update-live-context.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-lab-production-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gate fixed and pregame refresh windows
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os

          tz=ZoneInfo("America/New_York")
          now=datetime.now(tz)

          # Retain the established daily checkpoints.
          fixed_slots={(5,15),(10,30),(14,30),(17,30)}
          fixed=(now.hour,now.minute) in fixed_slots

          # Also refresh once for every game as it enters the ~15-minute
          # pregame window. A 7-23 minute window tolerates normal Actions
          # scheduling delay while avoiding adjacent quarter-hour duplicates.
          pregame=[]
          try:
              slate=json.loads(Path("public/data/today-games.json").read_text())
              for game in slate.get("games",[]):
                  start_raw=game.get("start_time_et")
                  if not start_raw:
                      continue
                  start=datetime.fromisoformat(start_raw).astimezone(tz)
                  minutes=(start-now).total_seconds()/60
                  if 7 <= minutes <= 23:
                      pregame.append({
                          "game_id":game.get("game_id"),
                          "matchup":f"{game.get('away_abbr')}@{game.get('home_abbr')}",
                          "minutes_to_start":round(minutes,1)
                      })
          except Exception as exc:
              print("pregame gate warning:",repr(exc))

          scheduled_run=bool(fixed or pregame)
          run=True if os.environ.get("GITHUB_EVENT_NAME")!="schedule" else scheduled_run
          reason="manual_or_push"
          if os.environ.get("GITHUB_EVENT_NAME")=="schedule":
              reason="pregame" if pregame else ("fixed_checkpoint" if fixed else "skip")

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")

          print(json.dumps({
              "local_time":now.isoformat(),
              "fixed_checkpoint":fixed,
              "pregame_games":pregame,
              "run":run,
              "reason":reason
          },indent=2))
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Install live-context dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch and normalize live context
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: python src/live_context/update_live_context.py
      - name: Detect confirmed-goalie change requiring model rescore
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        id: rescore
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          current=json.loads(Path("public/data/live-context.json").read_text())
          projection=json.loads(Path("public/data/game-projections.json").read_text())
          feature_version=str(projection.get("model",{}).get("feature_version","")).lower()
          uses_goalie="goalie" in feature_version

          try:
              prior_text=subprocess.check_output(
                  ["git","show","HEAD:public/data/live-context.json"],text=True
              )
              prior=json.loads(prior_text)
          except Exception:
              prior={"games":[]}

          def confirmed_map(payload):
              out={}
              for g in payload.get("games",[]):
                  gid=str(g.get("game_id"))
                  for side in ("away","home"):
                      goalie=(g.get(side) or {}).get("goalie") or {}
                      if goalie.get("status")=="CONFIRMED":
                          out[(gid,side)]=goalie.get("name")
              return out

          old=confirmed_map(prior)
          new=confirmed_map(current)
          changed=any(old.get(k)!=v for k,v in new.items())
          should=bool(changed and uses_goalie)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"confirmed_change={'true' if changed else 'false'}\n")
              fh.write(f"uses_goalie={'true' if uses_goalie else 'false'}\n")
              fh.write(f"run={'true' if should else 'false'}\n")
          print(json.dumps({
              "confirmed_goalie_change":changed,
              "active_model_uses_goalie":uses_goalie,
              "trigger_rescore":should,
              "feature_version":feature_version
          },indent=2))
          PY

      - name: Validate production files
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          node src/production/validate-public-data.mjs
          node src/production/validate-site-contract.mjs
      - name: Commit when changed
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/live-context.json public/data/game-projections.json
          if git diff --cached --quiet; then
            echo "No live-context change."
          else
            git commit -m "Update live NHL goalie and lineup context"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger goalie-aware pregame rescore
        if: (github.event_name != 'schedule' || steps.gate.outputs.run == 'true') && steps.rescore.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run score-hockey-lab-game-v1.yml -f reason=confirmed-goalie-change
