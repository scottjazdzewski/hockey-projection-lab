name: xG Research Scaffold Validation

on:
  push:
    branches: [codex/hockey-xg-implementation-20261106]
    paths:
      - 'research/xg_adaptive_decay_nested_20261106.py'
      - 'research/validate_goalie_snapshot_ledger_20261106.py'
      - 'research/schemas/goalie_pregame_snapshot_v1.schema.json'
      - '.github/workflows/xg-research-scaffold-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and schema JSON
        run: |
          python -m py_compile research/xg_adaptive_decay_nested_20261106.py research/validate_goalie_snapshot_ledger_20261106.py
          python -m json.tool research/schemas/goalie_pregame_snapshot_v1.schema.json >/dev/null
      - name: Validate schema, snapshot ledger, and EWMA leakage guard
        run: |
          python -m pip install --quiet jsonschema numpy pandas scipy scikit-learn
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from jsonschema import Draft202012Validator, FormatChecker
          from research.validate_goalie_snapshot_ledger_20261106 import validate
          from research.xg_adaptive_decay_nested_20261106 import build_ewma_columns, XG_METRICS

          schema=json.loads(Path("research/schemas/goalie_pregame_snapshot_v1.schema.json").read_text())
          validator=Draft202012Validator(schema,format_checker=FormatChecker())
          base={
              "schema_version":1,"game_id":2026020001,"team_abbr":"BOS",
              "scheduled_start_utc":"2026-11-06T20:00:00Z",
              "captured_at_utc":"2026-11-06T16:00:00Z",
              "assignment_state":"projected",
              "goalie":{"player_id":"8470001","name":"Example Goalie"},
              "source":"approved pregame feed","source_observed_at_utc":"2026-11-06T15:58:00Z",
              "capture_run_id":"fixture-001","forecast_version":"goals-60-009",
              "source_confidence":"medium"
          }
          rows=[base,{**base,"captured_at_utc":"2026-11-06T17:00:00Z",
              "assignment_state":"confirmed","source_observed_at_utc":"2026-11-06T16:59:00Z",
              "capture_run_id":"fixture-002","source_confidence":"high"}]
          for row in rows:
              errors=list(validator.iter_errors(row))
              assert not errors, errors
          fixture=Path("/tmp/goalie-ledger.jsonl")
          fixture.write_text("\n".join(json.dumps(r) for r in rows)+"\n")
          assert validate(fixture)==2
          invalid={**base,"actual_starter":"Example Goalie"}
          assert list(validator.iter_errors(invalid)), "schema must reject unknown outcome fields"
          fixture.write_text(json.dumps(invalid)+"\n")
          try:
              validate(fixture)
          except ValueError:
              pass
          else:
              raise AssertionError("ledger validator must reject outcome leakage")

          rows=[]
          for day in range(1,11):
              for team,opp in [("BOS","NYR"),("NYR","BOS")]:
                  vals={m:float(day if team=="BOS" else day*2) for m in XG_METRICS}
                  rows.append({"team":team,"opponent":opp,"game_date":pd.Timestamp(f"2026-01-{day:02d}"),**vals})
                  if day==5 and team=="BOS":
                      rows.append({"team":team,"opponent":opp,"game_date":pd.Timestamp(f"2026-01-{day:02d}"),
                                   **{m:float(day+10) for m in XG_METRICS}})
          frame=pd.DataFrame(rows)
          normal=build_ewma_columns(frame)
          changed=frame.copy()
          last=changed.game_date.eq(pd.Timestamp("2026-01-10"))
          changed.loc[last,list(XG_METRICS)]=10000.0
          perturbed=build_ewma_columns(changed)
          col="team_ewma20_fivev5_xg"
          a=normal[(normal.team=="BOS")&normal.game_date.eq(pd.Timestamp("2026-01-10"))][col].to_numpy()
          b=perturbed[(perturbed.team=="BOS")&perturbed.game_date.eq(pd.Timestamp("2026-01-10"))][col].to_numpy()
          assert len(a)==len(b)==1 and np.allclose(a,b), "same-date values leaked into their own EWMA"
          day5=normal[(normal.team=="BOS")&normal.game_date.eq(pd.Timestamp("2026-01-05"))][col]
          assert day5.nunique(dropna=True)<=1, "same-date duplicate rows must share one lagged team state"
          print("PASS: snapshot schema/ledger and strict-prior EWMA checks")
          PY
