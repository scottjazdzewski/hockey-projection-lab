name: Refresh Independent NHL Market Benchmark

on:
  workflow_dispatch:
  schedule:
    # Redundant wake-ups around the six approved ET collection slots.
    # The Python collector is the authority: it admits only 12:20, 18:50,
    # 19:20, 19:50, 20:50 and 21:50 ET (with a <24-minute grace window)
    # and refuses to spend twice in the same slot. These extra cron wakes
    # protect against GitHub skipping/delaying a single scheduled invocation.
    #
    # 12:20 ET (EST/EDT): retry every 5 min through the allowed grace window.
    - cron: '20-40/5 16,17 * * *'
    # :20 evening slot (19:20 ET), covering EST/EDT UTC hours.
    - cron: '20-40/5 23,0 * * *'
    # :50 evening slots (18:50, 19:50, 20:50, 21:50 ET), plus early-next-hour
    # retry minutes. Collector idempotency prevents duplicate paid requests.
    - cron: '50,55 22,23,0,1,2 * * *'
    - cron: '0,5,10 23,0,1,2,3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-benchmark.yml'

permissions:
  contents: write

concurrency:
  group: hockey-market-benchmark
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check market math and the pregame freeze contract
        run: python src/market/update_market_benchmark.py --self-test
      - name: Verify The Odds API key with a zero-credit request
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          key = os.environ.get("THE_ODDS_API_KEY", "").strip()
          if not key:
              raise SystemExit("ERROR: GitHub secret THE_ODDS_API_KEY is missing or empty")
          url = "https://api.the-odds-api.com/v4/sports/?" + urlencode({"apiKey": key})
          try:
              with urlopen(Request(url, headers={"User-Agent": "HockeyLab-KeyCheck/1.0"}), timeout=25) as response:
                  payload = json.load(response)
                  remaining = response.headers.get("x-requests-remaining", "not reported")
                  used = response.headers.get("x-requests-used", "not reported")
          except HTTPError as error:
              raise SystemExit(f"ERROR: The Odds API rejected the key (HTTP {error.code})") from None
          except (URLError, TimeoutError):
              raise SystemExit("ERROR: The Odds API connection was unavailable") from None
          if not isinstance(payload, list):
              raise SystemExit("ERROR: Unexpected sports-list response from The Odds API")
          print(f"PASS: API key authenticated on a zero-credit endpoint. Monthly used: {used}; remaining: {remaining}.")
          PY
      - name: Refresh multi-book odds (benchmark only)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python src/market/update_market_benchmark.py
      - name: Commit market data only
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/market-benchmark.json
          if [ -d research/market_benchmarks/live ]; then
            git add research/market_benchmarks/live/
          fi
          if git diff --cached --quiet; then
            echo "No market data change."
          else
            git commit -m "Capture independent NHL market moneylines"
            git pull --rebase origin main
            git push
          fi
