name: Refresh Independent NHL Market Benchmark

on:
  workflow_dispatch:
  schedule:
    # Broad UTC window covers both Eastern Standard and Daylight Time.
    # Python admits only 09:20, 12:20, 15:20 ET and every half-hour
    # from 17:20 through 22:50 ET; max 15 billed h2h US-region calls/day.
    # One region, one market = 1 credit/call (465 in a 31-day month).
    - cron: '20 13-23 * * *'
    - cron: '20 0-4 * * *'
    - cron: '50 21-23 * * *'
    - cron: '50 0-3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-benchmark.yml'

permissions:
  contents: write

concurrency:
  group: hockey-market-benchmark
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check market math and the pregame freeze contract
        run: python src/market/update_market_benchmark.py --self-test
      - name: Refresh multi-book odds (benchmark only)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python src/market/update_market_benchmark.py
      - name: Commit market data only
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/market-benchmark.json
          if [ -d research/market_benchmarks/live ]; then
            git add research/market_benchmarks/live/
          fi
          if git diff --cached --quiet; then
            echo "No market data change."
          else
            git commit -m "Capture independent NHL market moneylines"
            git pull --rebase origin main
            git push
          fi
