name: Refresh Independent NHL Market Benchmark

on:
  workflow_dispatch:
  schedule:
    # Half-hourly at :20/:50 UTC across the evening (covers :00/:30 ET puck drops
    # at about T-10); Python limits collection to 4PM-midnight America/New_York.
    # One h2h US-region request per run, usually <=16/day and <=500/month.
    - cron: '20,50 20-23 * * *'
    - cron: '20,50 0-5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-market-benchmark.yml'

permissions:
  contents: write

concurrency:
  group: hockey-market-benchmark
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check market math and the pregame freeze contract
        run: python src/market/update_market_benchmark.py --self-test
      - name: Refresh multi-book odds (benchmark only)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python src/market/update_market_benchmark.py
      - name: Commit market data only
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/market-benchmark.json research/market_benchmarks/live/
          if git diff --cached --quiet; then
            echo "No market data change."
          else
            git commit -m "Capture independent NHL market moneylines"
            git pull --rebase origin main
            git push
          fi
