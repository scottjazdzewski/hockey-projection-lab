name: Update Today's NHL Games

on:
  workflow_dispatch:
  schedule:
    # Morning rollover watchdog. GitHub cron delivery can be delayed or skipped,
    # so retry every 15 minutes across the EST/EDT morning window. The gate
    # below exits immediately once today's slate has been published.
    - cron: '*/15 9-12 * * *'
    # Daytime refreshes keep game states/current slate metadata fresh.
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-today-games.yml'
      - '.github/slate-watchdog-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: hockey-lab-slate-rollover
  cancel-in-progress: false

jobs:
  update-slate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Gate morning rollover retries
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os

          now=datetime.now(ZoneInfo("America/New_York"))
          today=now.date().isoformat()
          current_date=None
          try:
              current_date=json.loads(Path("public/data/today-games.json").read_text()).get("date")
          except Exception:
              pass

          event=os.environ.get("GITHUB_EVENT_NAME")
          # Push/manual runs always execute. Scheduled morning retries execute
          # only when the published slate is stale. Existing daytime cron
          # checkpoints still execute to refresh game state metadata.
          morning=(now.hour==4 and now.minute>=45) or (5 <= now.hour <= 8)
          daytime=now.hour in {11,12,16,17}
          run=(event!="schedule") or (morning and current_date!=today) or daytime

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"stale={'true' if current_date!=today else 'false'}\n")
          print(json.dumps({
              "local_time":now.isoformat(),
              "published_date":current_date,
              "today":today,
              "morning_window":morning,
              "daytime_checkpoint":daytime,
              "run":run
          },indent=2))
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas pyarrow requests
        if: steps.gate.outputs.run == 'true'
      - name: Build today's slate from official NHL source
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import json, re, requests, pandas as pd

          TZ=ZoneInfo("America/New_York")
          now=datetime.now(TZ)
          today=now.date().isoformat()
          TEAM_NAMES={
              "ANA":"Anaheim Ducks","BOS":"Boston Bruins","BUF":"Buffalo Sabres","CAR":"Carolina Hurricanes",
              "CBJ":"Columbus Blue Jackets","CGY":"Calgary Flames","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
              "DAL":"Dallas Stars","DET":"Detroit Red Wings","EDM":"Edmonton Oilers","FLA":"Florida Panthers",
              "LAK":"Los Angeles Kings","MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NJD":"New Jersey Devils",
              "NSH":"Nashville Predators","NYI":"New York Islanders","NYR":"New York Rangers","OTT":"Ottawa Senators",
              "PHI":"Philadelphia Flyers","PIT":"Pittsburgh Penguins","SEA":"Seattle Kraken","SJS":"San Jose Sharks",
              "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs","UTA":"Utah Mammoth",
              "VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights","WPG":"Winnipeg Jets","WSH":"Washington Capitals"
          }

          games=[]
          source=None

          # LIVE DAILY AUTHORITY: official NHL score feed. This is the source
          # the public Game Cards should trust for the current day's slate.
          # An empty successful response is authoritative (it may be an off day).
          try:
              live_url=f"https://api-web.nhle.com/v1/score/{today}"
              lr=requests.get(
                  live_url,
                  timeout=60,
                  headers={"User-Agent":"HockeyProjectionLab/1.0"}
              )
              lr.raise_for_status()
              live=lr.json()
              if not isinstance(live.get("games",[]),list):
                  raise ValueError("NHL score feed returned invalid games payload")
              for g in live.get("games",[]):
                  start=g.get("startTimeUTC")
                  try:
                      t=pd.to_datetime(start,utc=True).tz_convert("America/New_York")
                      time_et=t.strftime("%-I:%M %p ET")
                      start_time_et=t.isoformat()
                  except Exception:
                      time_et="TBD"
                      start_time_et=None
                  away=g.get("awayTeam",{}) or {}
                  home=g.get("homeTeam",{}) or {}
                  aa=away.get("abbrev","")
                  ha=home.get("abbrev","")
                  games.append({
                      "game_id":g.get("id"),
                      "away_abbr":aa,
                      "away_name":TEAM_NAMES.get(aa,aa),
                      "home_abbr":ha,
                      "home_name":TEAM_NAMES.get(ha,ha),
                      "time_et":time_et,
                      "start_time_et":start_time_et,
                      "state":g.get("gameState","PRE")
                  })
              source="Official NHL live score feed"
              print(f"Official NHL source returned {len(games)} games for {today}")
          except Exception as exc:
              # FALLBACK ONLY: archival SportsDataverse schedule. This is never
              # preferred over a successful official NHL response.
              print("Official NHL source unavailable; using SportsDataverse fallback:",repr(exc))
              url="https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nhl_schedules/nhl_schedule_master.parquet"
              p=Path("/tmp/nhl_schedule_master.parquet")
              r=requests.get(url,timeout=120)
              r.raise_for_status()
              p.write_bytes(r.content)
              df=pd.read_parquet(p)
              day=df[df["game_date"].astype(str).str[:10].eq(today)].copy()

              def parse_start(v):
                  if pd.isna(v): return ("TBD", None)
                  s=str(v).strip()
                  m=re.match(r"^(\\d{1,2}):(\\d{2})(?::\\d{2})?$",s)
                  if m:
                      h=int(m.group(1)); minute=int(m.group(2))
                      local=pd.Timestamp(f"{today} {h:02d}:{minute:02d}:00",tz="America/New_York")
                      return (local.strftime("%-I:%M %p ET"), local.isoformat())
                  try:
                      t=pd.to_datetime(s,utc=True)
                      if pd.notna(t):
                          local=t.tz_convert("America/New_York")
                          return (local.strftime("%-I:%M %p ET"), local.isoformat())
                  except Exception:
                      pass
                  return (s, None)

              for _,g in day.sort_values(["game_time","game_id"],na_position="last").iterrows():
                  time_et,start_time_et=parse_start(g.get("game_time"))
                  aa=str(g.get("away_team_abbr",""))
                  ha=str(g.get("home_team_abbr",""))
                  games.append({
                      "game_id":None if pd.isna(g.get("game_id")) else int(g["game_id"]),
                      "away_abbr":aa,
                      "away_name":TEAM_NAMES.get(aa,str(g.get("away_team_name",""))),
                      "home_abbr":ha,
                      "home_name":TEAM_NAMES.get(ha,str(g.get("home_team_name",""))),
                      "time_et":time_et,
                      "start_time_et":start_time_et,
                      "state":str(g.get("game_state","PRE"))
                  })
              source="SportsDataverse NHL schedule master fallback"

          payload={
              "date":today,
              "timezone":"America/New_York",
              "display_date":now.strftime("%A, %B %-d"),
              "updated_at":now.isoformat(),
              "source":source,
              "games":games
          }
          out=Path("public/data/today-games.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          PY
      - name: Commit slate when changed
        if: steps.gate.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "hockey-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/today-games.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No slate change."
          else
            git commit -m "Update today's NHL slate"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start daily live-context and projection rollover
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-live-context.yml -f reason=daily-slate-rollover
